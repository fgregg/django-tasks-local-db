name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        django-tasks-db: ["release"]
        include:
          # Canary: catch upstream changes before they ship. Allowed to fail.
          - python-version: "3.13"
            django-tasks-db: "main"
    continue-on-error: ${{ matrix.django-tasks-db == 'main' }}
    name: test (py${{ matrix.python-version }}, django-tasks-db ${{ matrix.django-tasks-db }})

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: django_tasks_test
          POSTGRES_USER: django_tasks
          POSTGRES_PASSWORD: django_tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGDATABASE: django_tasks_test
      PGUSER: django_tasks
      PGPASSWORD: django_tasks
      PGHOST: localhost
      PGPORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres]"
      - name: Install django-tasks-db from main
        if: matrix.django-tasks-db == 'main'
        run: pip install --upgrade "git+https://github.com/RealOrangeOne/django-tasks-db.git@main"
      - name: Run tests (PostgreSQL)
        run: python -m pytest tests/ -v
      - name: Run tests (SQLite)
        run: python -m pytest tests/ -v --ds=tests.settings_sqlite
